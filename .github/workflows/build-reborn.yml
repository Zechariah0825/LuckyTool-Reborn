name: Build LuckyTool Reborn APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reborn-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK and run unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out this commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android 17 platform
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify committed project
        shell: bash
        run: |
          set -euo pipefail
          test -f app/build.gradle.kts
          test -f settings.gradle.kts
          test -f gradle/wrapper/gradle-wrapper.jar
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradlew
          java -version
          bash ./gradlew --version
      - name: Build debug APK
        id: build
        run: bash ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Run required unit tests
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Record build provenance and APK hashes
        if: always() && steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reborn-artifact
          cp app/build/outputs/apk/debug/*.apk build/reborn-artifact/
          cp app/build/outputs/apk/debug/output-metadata.json build/reborn-artifact/
          printf 'repository=%s\ncommit=%s\nrun=%s/%s/actions/runs/%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_SERVER_URL" \
            "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build/reborn-artifact/build-info.txt
          (cd build/reborn-artifact && sha256sum ./*.apk > SHA256SUMS)
      - name: Upload debug APK and build information
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LuckyTool-Reborn-debug-${{ github.sha }}
          path: build/reborn-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LuckyTool-Reborn-tests-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: Full lint report (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out this commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android 17 platform and required build tools
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run full lint without suppressions
        id: lint
        continue-on-error: true
        run: bash ./gradlew --no-daemon --stacktrace :app:lintDebug
      - name: Report actual lint outcome
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        shell: bash
        run: |
          {
            echo '## Full lint result (non-blocking)'
            echo "Actual lint outcome: **${LINT_OUTCOME:-not run}**"
            echo 'APK compilation and unit tests are required in the separate build job.'
            echo 'A green workflow does not imply lint is clean. Inspect the full lint report artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$LINT_OUTCOME" = failure ]; then
            echo '::warning title=Full lint failed::Lint found errors. See the full lint report artifact. No blanket suppression or baseline was applied.'
          fi
      - name: Upload complete lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LuckyTool-Reborn-lint-${{ github.sha }}
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
