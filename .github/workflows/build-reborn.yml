name: Build LuckyTool Reborn APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/build-reborn.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Verify project import
        run: |
          test -f gradlew
          test -d app
      - name: Build APK
        run: bash ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuckyTool-Reborn-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
